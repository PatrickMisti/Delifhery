<div>
  <mat-card>
    <mat-stepper orientation="horizontal" [formGroup]="form" #stepper linear>

      <!-- STEP 1: Adressen -->
      <mat-step [stepControl]="ownAddressOrigin"  [state]="'address'">
        <form [formGroup]="ownAddressOrigin">
          <h3>Adressabsender</h3>

          <mat-slide-toggle [formControl]="useOwnAddressOrigin" (click)="useOwnAddress()">Eigene Addresse verwenden</mat-slide-toggle>

          <div class="p-8">
            <div class="wrapper">
              <mat-form-field appearance="outline" class="p-right-16">
                <mat-label>Straße</mat-label>
                <input matInput formControlName="street">
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Nr.</mat-label>
                <input matInput formControlName="household">
              </mat-form-field>
            </div>
            <div class="wrapper">
              <mat-form-field appearance="outline" class="p-right-16">
                <mat-label>PLZ</mat-label>
                <input matInput formControlName="zip" type="number">
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Stadt</mat-label>
                <input matInput formControlName="city">
              </mat-form-field>
            </div>
            <mat-form-field appearance="outline">
              <mat-label>Land</mat-label>
              <input matInput formControlName="state">
            </mat-form-field>
          </div>

          <button mat-button matStepperNext [disabled]="ownAddressOrigin.invalid && !useOwnAddressOrigin.value">Weiter</button>
        </form>
      </mat-step>

      <!-- STEP 2: Paketdaten -->
      <mat-step [stepControl]="addressDest" [state]="'size'">
        <form [formGroup]="addressDest">
          <h3>Adressempfänger</h3>


          <div class="p-8">
            <div class="wrapper">
              <mat-form-field appearance="outline" class="p-right-16">
                <mat-label>Straße</mat-label>
                <input matInput formControlName="street">
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Nr.</mat-label>
                <input matInput formControlName="household">
              </mat-form-field>
            </div>
            <div class="wrapper">
              <mat-form-field appearance="outline" class="p-right-16">
                <mat-label>PLZ</mat-label>
                <input matInput formControlName="zip" type="number">
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Stadt</mat-label>
                <input matInput formControlName="city">
              </mat-form-field>
            </div>
            <mat-form-field appearance="outline">
              <mat-label>Land</mat-label>
              <input matInput formControlName="state">
            </mat-form-field>
          </div>

          <button mat-button matStepperPrevious>Zurück</button>
          <button mat-button matStepperNext [disabled]="addressDest.invalid">Weiter</button>
        </form>
      </mat-step>

      <!-- STEP 3: Bestätigung -->
      <mat-step [stepControl]="packageForm" [state]="'check'">
        <form [formGroup]="packageForm">
          <h3>Paket</h3>

          <div class="p-8">
            <div class="wrapper">
              <mat-form-field appearance="outline" class="p-right-16">
                <mat-label>Breite</mat-label>
                <input matInput formControlName="width" type="number">
                <span matTextSuffix>cm</span>
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Länge</mat-label>
                <input matInput formControlName="length" type="number">
                <span matTextSuffix>cm</span>
              </mat-form-field>
            </div>

            <div class="wrapper">
              <mat-form-field appearance="outline" class="p-right-16">
                <mat-label>Höhe</mat-label>
                <input matInput formControlName="height" type="number">
                <span matTextSuffix>cm</span>
              </mat-form-field>
              <mat-form-field appearance="outline">
                <mat-label>Gewicht</mat-label>
                <input matInput formControlName="weight" type="number">
                <span matTextSuffix>kg</span>
              </mat-form-field>
            </div>
          </div>

          <button mat-button matStepperPrevious>Zurück</button>
          <button mat-button [disabled]="packageForm.invalid" (click)="calculatePrice()">Fertig</button>
        </form>
      </mat-step>
    </mat-stepper>
  </mat-card>
</div>
